[project]
name = "stk"
version = "0.1.0"
description = "Core library + CLI: NSE/BSE ingest, backtest engine, strategy DSL, API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "typer>=0.13",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "yfinance>=1.7",
    "curl_cffi>=0.7",
    "tenacity>=9.0",
    "python-dateutil>=2.9",
]

[project.scripts]
stk = "stk.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stk"]
